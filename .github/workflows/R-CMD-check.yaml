# Based on r-lib/actions examples: https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.name || format('{0} ({1})', matrix.config.os, matrix.config.r) }}

    strategy:
      fail-fast: false
      matrix:
        # Every job but one runs the full suite (NOT_CRAN=true), including
        # the image stress, adversarial and fuzz tests that skip on CRAN.
        # One job runs exactly what CRAN's machines will run.
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', not-cran: 'false', name: 'ubuntu-latest (release, CRAN mode)'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # Oldest supported ggplot2, which takes a different margin code path.
          - {os: ubuntu-latest,  r: 'release', extra: 'ggplot2@3.5.2', name: 'ubuntu-latest (ggplot2 3.5.2)'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: ${{ matrix.config.not-cran || 'true' }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck ${{ matrix.config.extra }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # Proof that the tests ran, and how many: testthat's own tally from
      # inside R CMD check, in the log and on the run summary.
      - name: Test results
        if: always()
        shell: Rscript {0}
        run: |
          out <- Sys.glob("check/*.Rcheck/tests/testthat.Rout*")
          if (length(out) == 0L) stop("No testthat output: the tests did not run.")
          lines <- unlist(lapply(out, readLines))
          cat(tail(lines, 30), sep = "\n")
          tally <- grep("\\[ FAIL [0-9]+ \\| WARN [0-9]+ \\| SKIP [0-9]+ \\| PASS [0-9]+ \\]", lines, value = TRUE)
          summary <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary)) {
            write(sprintf("NOT_CRAN=%s: %s", Sys.getenv("NOT_CRAN"), paste(tail(tally, 1), collapse = "")),
                  summary, append = TRUE)
          }
