# Runs the full image-transform stress matrix and a lineage fuzz campaign on
# every OS and posts the results to the run summary. Weekly runs catch drift
# in ggplot2, graphics devices or the JPEG library.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

name: robustness

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robustness:
    runs-on: ${{ matrix.os }}
    name: robustness (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Run stress matrix
        run: Rscript tools/robustness-report.R

      # Lineage fuzz: random IDs, corrupted and cross-joined rows, repair
      # against foreign rows, and composed, perturbed images. Fails on any
      # wrong ID. The seed changes every run, and is printed in the summary.
      - name: Lineage fuzz campaign
        run: Rscript tools/lineage-fuzz-campaign.R 20000 1000 150 ${{ github.run_number }}
